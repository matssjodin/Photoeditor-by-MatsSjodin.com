# Cloudflare Workers deployment config.
#
# The build produces a module worker (dist/server/server.js, exporting
# { fetch }) plus a static client bundle (dist/client). Workers Assets serves
# the static files directly and falls through to the worker for everything else
# (the SSR routes), which is exactly what this app needs.
#
# Before the first deploy:
#   1. Set `account_id` below (or provide CLOUDFLARE_ACCOUNT_ID in CI).
#   2. Run `bun run build` then `bunx wrangler deploy`.
#   3. Point the photoeditor.matssjodin.com custom domain at this Worker
#      (Workers & Pages → this worker → Settings → Domains & Routes).

name = "photo-editor"
main = "dist/server/server.js"
compatibility_date = "2025-01-01"
# The server reads node:process (src/lib/config.server.ts), so Node APIs must be on.
compatibility_flags = ["nodejs_compat"]

# account_id = "<your-cloudflare-account-id>"

[assets]
directory = "dist/client"
# Unmatched paths fall through to the SSR worker rather than returning 404.
not_found_handling = "none"

[observability]
enabled = true
